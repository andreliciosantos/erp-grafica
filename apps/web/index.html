<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full antialiased">
  <head>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#090e18" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('erp_theme');
          var isDark = true;

          if (t === 'light') {
            isDark = false;
          } else if (t === 'dark') {
            isDark = true;
          } else {
            // 'system' ou primeira visita: detecta a preferência nativa do dispositivo
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP Gráfica Modular</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full selection:bg-emerald-500 selection:text-white font-['Plus_Jakarta_Sans',sans-serif] bg-slate-50 dark:bg-[#090e18] text-slate-850 dark:text-slate-100">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
