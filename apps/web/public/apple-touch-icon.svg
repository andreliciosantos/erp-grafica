<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="apple-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="apple-paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="cmyk-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="33%" stop-color="#ec4899" />
      <stop offset="66%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- iOS squircle friendly full bleed background -->
  <rect width="512" height="512" fill="url(#apple-bg)" />

  <g transform="translate(96, 88)">
    <!-- Top Paper -->
    <path d="M 64 24 L 256 24 L 256 112 L 64 112 Z" fill="url(#apple-paper)" rx="8" />
    <line x1="88" y1="52" x2="232" y2="52" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
    <line x1="88" y1="76" x2="184" y2="76" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />

    <!-- Main Body -->
    <rect x="16" y="104" width="288" height="152" rx="28" fill="#0f172a" />
    <rect x="44" y="132" width="136" height="32" rx="8" fill="#022c22" />
    <rect x="52" y="140" width="48" height="16" rx="4" fill="#10b981" />
    <circle cx="156" cy="148" r="6" fill="#34d399" />
    <circle cx="216" cy="148" r="10" fill="#334155" />
    <circle cx="248" cy="148" r="10" fill="#10b981" />
    <circle cx="276" cy="148" r="8" fill="#ef4444" />

    <!-- CMYK -->
    <rect x="44" y="180" width="232" height="12" rx="6" fill="url(#cmyk-bar)" />

    <!-- Paper Out -->
    <path d="M 48 240 L 272 240 L 248 312 L 72 312 Z" fill="#1e293b" />
    <path d="M 64 220 L 256 220 L 256 288 L 64 288 Z" fill="url(#apple-paper)" />
    <circle cx="96" cy="254" r="12" fill="#06b6d4" />
    <circle cx="132" cy="254" r="12" fill="#ec4899" />
    <circle cx="168" cy="254" r="12" fill="#eab308" />
    <circle cx="204" cy="254" r="12" fill="#0f172a" />
  </g>
</svg>
