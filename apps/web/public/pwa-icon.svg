<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="33%" stop-color="#ec4899" />
      <stop offset="66%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer Glass Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Inner Industrial Printer Graphic -->
  <g filter="url(#drop-shadow)" transform="translate(96, 88)">
    <!-- Top Paper Input Tray -->
    <path d="M 64 24 L 256 24 L 256 112 L 64 112 Z" fill="url(#paper-grad)" rx="8" />
    <!-- Paper Grid Lines -->
    <line x1="88" y1="52" x2="232" y2="52" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
    <line x1="88" y1="76" x2="184" y2="76" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />

    <!-- Main Printer Chassis -->
    <rect x="16" y="104" width="288" height="152" rx="28" fill="#0f172a" />

    <!-- Printer LED Display Screen -->
    <rect x="44" y="132" width="136" height="32" rx="8" fill="#022c22" />
    <rect x="52" y="140" width="48" height="16" rx="4" fill="#10b981" />
    <circle cx="156" cy="148" r="6" fill="#34d399" />

    <!-- Control Buttons -->
    <circle cx="216" cy="148" r="10" fill="#334155" />
    <circle cx="248" cy="148" r="10" fill="#10b981" />
    <circle cx="276" cy="148" r="8" fill="#ef4444" />

    <!-- CMYK Color Registration Bar -->
    <rect x="44" y="180" width="232" height="12" rx="6" fill="url(#accent-grad)" />

    <!-- Paper Output Tray & Emerging Print -->
    <path d="M 48 240 L 272 240 L 248 312 L 72 312 Z" fill="#1e293b" />
    <path d="M 64 220 L 256 220 L 256 288 L 64 288 Z" fill="url(#paper-grad)" />

    <!-- Fresh Ink Pattern on Output Sheet -->
    <circle cx="96" cy="254" r="12" fill="#06b6d4" />
    <circle cx="132" cy="254" r="12" fill="#ec4899" />
    <circle cx="168" cy="254" r="12" fill="#eab308" />
    <circle cx="204" cy="254" r="12" fill="#0f172a" />
  </g>
</svg>
